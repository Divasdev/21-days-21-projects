<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Stopwatch</title>
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
   <style>
      * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
         font-family: 'Poppins', sans-serif;
      }

      body {
         background: #2c3e50;
         display: flex;
         justify-content: center;
         align-items: center;
         min-height: 100vh;
      }

      .stopwatch {
         width: 90%;
         max-width: 600px;
         background: linear-gradient(135deg, #1e3a5f, #1e5f58);
         color: #fff;
         text-align: center;
         padding: 50px 0;
         border-radius: 10px;
         box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .display {
         font-size: 60px;
         font-weight: 500;
         margin-bottom: 30px;
      }

      .buttons {
         display: flex;
         justify-content: center;
         gap: 20px;
      }

      .buttons img {
         width: 50px;
         height: 50px;
         cursor: pointer;
         filter: invert(1);
         transition: transform 0.2s;
      }

      .buttons img:hover {
         transform: scale(1.1);
      }

      /* Custom styles for buttons if images are not available or preferred as buttons */
      .btn-control {
         width: 60px;
         height: 60px;
         border-radius: 50%;
         border: none;
         background: rgba(255, 255, 255, 0.2);
         color: white;
         font-size: 20px;
         cursor: pointer;
         transition: background 0.3s;
         display: flex;
         align-items: center;
         justify-content: center;
      }

      .btn-control:hover {
         background: rgba(255, 255, 255, 0.4);
      }
   </style>
</head>

<body>
   <div class="stopwatch">
      <h1 class="display" id="timeDisplay">00:00:00</h1>
      <div class="buttons">
         <button class="btn-control" id="stopBtn" onclick="watchStop()">
            &#9632; <!-- Square for Stop -->
            Stop
         </button>
         <button class="btn-control" id="startBtn" onclick="watchStart()">
            &#9658; <!-- Triangle for Start -->
            Start
         </button>
         <button class="btn-control" id="resetBtn" onclick="watchReset()">
            &#8635;
            Reset<!-- Circular arrow for Reset -->
         </button>
      </div>
   </div>

   <script>
      let [seconds, minutes, hours] = [0, 0, 0];
      let displayTime = document.getElementById("timeDisplay");
      let timer = null;
      function updateDisplay() {
         let h = hours.toString().padStart(2, '0');
         let m = minutes.toString().padStart(2, '0');
         let s = seconds.toString().padStart(2, '0');
         let timeString = `${h}:${m}:${s}`;
         displayTime.textContent=timeString;  
         }
     

      function runStopwatch(){
         seconds+=1
         if (seconds==60){
            seconds=0;
            minutes+=1;
         }
         if (minutes==60){
            minutes=0;
            hours+=1;
         }
         updateDisplay();
      }
    


   function watchStart(){
      timer=setInterval(runStopwatch,1000);
      
   }
        
         
        

         


        
         
      

   
   </script>
</body>

</html>
